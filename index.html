<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #fff;
    }
    img {
      max-width: 100%;
      max-height: 80vh;
      display: block;
    }
  </style>
</head>
<body>
  <img src="image1.jpg" alt="Image 1">
  <img src="image2.jpeg" alt="Image 2">
  <img src="image3.jpeg" alt="Image 3">
</body>
</html>
